<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – MeetMind</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card glass">
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to MeetMind</p>
      <div id="alert" class="alert hidden"></div>
      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" class="form-control" name="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" class="form-control" name="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Sign In</button>
      </form>
      <p class="auth-footer">
        <a href="/forgot-password.html">Forgot password?</a><br><br>
        Don't have an account? <a href="/register.html">Register</a>
      </p>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    redirectIfAuth();
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alert = document.getElementById('alert');
      const fd = new FormData(e.target);
      try {
        const data = await api.login({ email: fd.get('email'), password: fd.get('password') });
        api.setToken(data.token);
        api.setUser(data.user);
        window.location.href = '/dashboard.html';
      } catch (err) {
        showAlert(alert, err.message);
      }
    });
  </script>
</body>
</html>
