<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – MeetMind</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card glass">
      <h1>Create account</h1>
      <p class="subtitle">Join MeetMind today</p>
      <div id="alert" class="alert hidden"></div>
      <form id="registerForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" class="form-control" name="name" required placeholder="John Doe">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" class="form-control" name="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" class="form-control" name="password" required minlength="6" placeholder="Min 6 characters">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Create Account</button>
      </form>
      <p class="auth-footer">Already have an account? <a href="/login.html">Sign in</a></p>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    redirectIfAuth();
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alert = document.getElementById('alert');
      const fd = new FormData(e.target);
      try {
        const data = await api.register({
          name: fd.get('name'),
          email: fd.get('email'),
          password: fd.get('password')
        });
        api.setToken(data.token);
        api.setUser(data.user);
        window.location.href = '/dashboard.html';
      } catch (err) {
        showAlert(alert, err.message);
      }
    });
  </script>
</body>
</html>
