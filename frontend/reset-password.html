<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password – MeetMind</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card glass">
      <h1>Reset password</h1>
      <p class="subtitle">Enter your new password</p>
      <div id="alert" class="alert hidden"></div>
      <form id="resetForm">
        <input type="hidden" name="token" id="token">
        <div class="form-group">
          <label>New Password</label>
          <input type="password" class="form-control" name="password" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Reset Password</button>
      </form>
      <p class="auth-footer"><a href="/login.html">Back to login</a></p>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById('token').value = params.get('token') || '';

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alert = document.getElementById('alert');
      const fd = new FormData(e.target);
      try {
        await api.resetPassword({ token: fd.get('token'), password: fd.get('password') });
        showAlert(alert, 'Password reset successful! Redirecting to login...', 'success');
        setTimeout(() => window.location.href = '/login.html', 2000);
      } catch (err) {
        showAlert(alert, err.message);
      }
    });
  </script>
</body>
</html>
