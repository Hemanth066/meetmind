<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Meeting Stats – MeetMind</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="/dashboard.html" class="logo">Meet<span>Mind</span></a>
      <ul class="nav-links"><li><a href="/dashboard.html">← Dashboard</a></li></ul>
    </div>
  </nav>

  <main class="dashboard container">
    <div class="welcome-banner glass">
      <div>
        <h1 id="reportTitle">Meeting Summary & Transcript</h1>
        <p id="reportMeta"></p>
      </div>
    </div>

    <section class="glass" style="padding:2rem;margin-bottom:2rem">
      <h2 class="section-title">AI Meeting Summary</h2>
      <p id="aiSummary" style="color:var(--text-muted);margin-top:0.5rem;line-height:1.6">Loading summary...</p>
      
      <h3 style="margin-top:1.5rem">Key Discussion Points</h3>
      <ul id="keyPoints" style="padding-left:1.2rem;color:var(--text-muted);line-height:1.6"></ul>

      <h3 style="margin-top:1.5rem">Action Items</h3>
      <ul id="actionItems" style="padding-left:1.2rem;color:var(--text-muted);line-height:1.6"></ul>
    </section>

    <section class="glass" style="padding:2rem">
      <h2 class="section-title">Full Meeting Transcript</h2>
      <pre id="transcript" style="white-space:pre-wrap;color:var(--text-muted);font-size:0.9rem;margin-top:0.5rem;background:rgba(0,0,0,0.2);padding:1rem;border-radius:8px;max-height:400px;overflow-y:auto"></pre>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script>
    if (!requireAuth()) throw new Error('Auth required');
    const meetingId = new URLSearchParams(window.location.search).get('id');
    if (!meetingId) window.location.href = '/dashboard.html';

    async function load() {
      const data = await api.getParticipantAnalytics(meetingId);
      const { meeting, summary, keyPoints, actionItems, transcript } = data;

      document.getElementById('reportTitle').textContent = meeting.title || 'Meeting Summary & Transcript';
      document.getElementById('reportMeta').textContent = formatDate(meeting.endedAt || meeting.startedAt);

      // AI Summary
      document.getElementById('aiSummary').textContent = summary || 'Summary not available.';

      const kpEl = document.getElementById('keyPoints');
      if (keyPoints && keyPoints.length > 0) {
        kpEl.innerHTML = keyPoints.map(kp => `<li>${kp}</li>`).join('');
      } else {
        kpEl.innerHTML = '<li>No key points recorded</li>';
      }

      const aiEl = document.getElementById('actionItems');
      if (actionItems && actionItems.length > 0) {
        aiEl.innerHTML = actionItems.map(ai => typeof ai === 'string' ? `<li>${ai}</li>` : `<li><strong>${ai.task}</strong> ${ai.assignee ? `(Assigned: ${ai.assignee})` : ''}</li>`).join('');
      } else {
        aiEl.innerHTML = '<li>No action items recorded</li>';
      }

      // Transcript
      document.getElementById('transcript').textContent = transcript || 'No transcript recorded for this meeting.';
    }

    load().catch(err => alert(err.message));
  </script>
</body>
</html>
