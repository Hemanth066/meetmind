<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password – MeetMind</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card glass">
      <h1>Forgot password</h1>
      <p class="subtitle">We'll send you a reset link</p>
      <div id="alert" class="alert hidden"></div>
      <form id="forgotForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" class="form-control" name="email" required placeholder="you@example.com">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Send Reset Link</button>
      </form>
      <p class="auth-footer"><a href="/login.html">Back to login</a></p>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alert = document.getElementById('alert');
      const fd = new FormData(e.target);
      try {
        await api.forgotPassword(fd.get('email'));
        showAlert(alert, 'If that email exists, a reset link was sent. Check your inbox or server logs (dev mode).', 'success');
      } catch (err) {
        showAlert(alert, err.message);
      }
    });
  </script>
</body>
</html>
