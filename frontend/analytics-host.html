<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Host Analytics – MeetMind</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="/dashboard.html" class="logo">Meet<span>Mind</span></a>
      <ul class="nav-links"><li><a href="/dashboard.html">← Dashboard</a></li></ul>
    </div>
  </nav>

  <main class="dashboard container">
    <div class="welcome-banner glass">
      <div>
        <h1 id="reportTitle">Meeting Analytics</h1>
        <p id="reportMeta"></p>
      </div>
      <button id="downloadBtn" class="btn btn-primary">Download PDF Report</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card glass">
        <div class="value" id="totalParticipants">0</div>
        <div class="label">Total Participants</div>
      </div>
      <div class="stat-card glass">
        <div class="value" id="meetingDuration">0m</div>
        <div class="label">Duration</div>
      </div>
      <div class="stat-card glass">
        <div class="value" id="avgEngagement">0%</div>
        <div class="label">Avg Engagement</div>
      </div>
    </div>

    <div class="analytics-grid">
      <div class="chart-card glass">
        <h3>Speaking Time</h3>
        <div class="bar-chart" id="speakingChart"></div>
      </div>
      <div class="chart-card glass">
        <h3>Engagement Scores</h3>
        <div class="bar-chart" id="engagementChart"></div>
      </div>
    </div>

    <section class="glass" style="padding:1.5rem;margin-bottom:2rem">
      <h2 class="section-title">AI Summary</h2>
      <p id="aiSummary" style="color:var(--text-muted)">Loading...</p>
      <h3 style="margin-top:1.5rem">Key Discussion Points</h3>
      <ul id="keyPoints"></ul>
      <h3 style="margin-top:1.5rem">Action Items</h3>
      <ul id="actionItems"></ul>
      <h3 style="margin-top:1.5rem">Keywords</h3>
      <div id="keywords" style="display:flex;flex-wrap:wrap;gap:0.5rem"></div>
    </section>

    <section class="glass" style="padding:1.5rem;margin-bottom:2rem">
      <h2 class="section-title">Transcript</h2>
      <pre id="transcript" style="white-space:pre-wrap;color:var(--text-muted);font-size:0.9rem"></pre>
    </section>

    <section>
      <h2 class="section-title">Participants</h2>
      <div id="participantCards"></div>
    </section>

    <div id="participantDetail" class="participant-detail glass hidden"></div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    if (!requireAuth()) throw new Error('Auth required');
    const meetingId = new URLSearchParams(window.location.search).get('id');
    if (!meetingId) window.location.href = '/dashboard.html';

    function renderBarChart(container, items, maxVal) {
      container.innerHTML = items.map(item => `
        <div class="bar-row">
          <span class="label">${item.label}</span>
          <div class="bar-bg"><div class="bar-fill" style="width:${Math.min(100, (item.value / maxVal) * 100)}%"></div></div>
          <span class="value">${item.display}</span>
        </div>
      `).join('');
    }

    function showParticipantDetail(p) {
      const el = document.getElementById('participantDetail');
      el.classList.remove('hidden');
      const visual = p.visualMetricsAvailable ? `
        <div class="metric-item"><div class="val">${Math.round(p.aiObservations?.faceVisibility || 0)}%</div><div class="lbl">Face Visibility</div></div>
        <div class="metric-item"><div class="val">${Math.round(p.aiObservations?.headPoseForward || 0)}%</div><div class="lbl">Head Pose</div></div>
        <div class="metric-item"><div class="val">${Math.round(p.aiObservations?.eyeForward || 0)}%</div><div class="lbl">Eye Direction</div></div>
      ` : '<p style="color:var(--text-muted)">Visual metrics: Not Available</p>';

      el.innerHTML = `
        <h3>${p.user?.name || 'Participant'}</h3>
        <div class="metric-grid">
          <div class="metric-item"><div class="val">${formatDate(p.joinTime)}</div><div class="lbl">Join Time</div></div>
          <div class="metric-item"><div class="val">${formatDate(p.leaveTime)}</div><div class="lbl">Leave Time</div></div>
          <div class="metric-item"><div class="val">${formatSeconds(p.speakingTimeSeconds || 0)}</div><div class="lbl">Speaking Time</div></div>
          <div class="metric-item"><div class="val">${p.engagementScore || 0}%</div><div class="lbl">Engagement</div></div>
          <div class="metric-item"><div class="val">${p.cameraEnabled ? 'On' : p.cameraExempt ? 'Exempt' : 'Off'}</div><div class="lbl">Camera</div></div>
          <div class="metric-item"><div class="val">${p.chatMessageCount || 0}</div><div class="lbl">Chat Messages</div></div>
        </div>
        <h4 style="margin-top:1rem">AI Observations</h4>
        <div class="metric-grid">${visual}</div>
      `;
      el.scrollIntoView({ behavior: 'smooth' });
    }

    async function load() {
      const data = await api.getHostAnalytics(meetingId);
      const { meeting, participants, analytics } = data;

      document.getElementById('reportTitle').textContent = meeting.title;
      document.getElementById('reportMeta').textContent =
        `ID: ${meeting.meetingId} · ${formatDate(meeting.endedAt || meeting.startedAt)}`;
      document.getElementById('totalParticipants').textContent = participants.length;
      document.getElementById('meetingDuration').textContent = formatDuration(meeting.duration);

      const avgEng = participants.length
        ? Math.round(participants.reduce((s, p) => s + (p.engagementScore || 0), 0) / participants.length)
        : 0;
      document.getElementById('avgEngagement').textContent = avgEng + '%';

      const maxSpeak = Math.max(...participants.map(p => p.speakingTimeSeconds || 0), 1);
      renderBarChart(
        document.getElementById('speakingChart'),
        participants.map(p => ({
          label: p.user?.name || 'Unknown',
          value: p.speakingTimeSeconds || 0,
          display: formatSeconds(p.speakingTimeSeconds || 0)
        })),
        maxSpeak
      );

      renderBarChart(
        document.getElementById('engagementChart'),
        participants.map(p => ({
          label: p.user?.name || 'Unknown',
          value: p.engagementScore || 0,
          display: (p.engagementScore || 0) + '%'
        })),
        100
      );

      document.getElementById('aiSummary').textContent = analytics?.summary || 'Summary processing...';
      document.getElementById('keyPoints').innerHTML = (analytics?.keyPoints || [])
        .map(p => `<li>${p}</li>`).join('') || '<li>No key points yet</li>';
      document.getElementById('actionItems').innerHTML = (analytics?.actionItems || [])
        .map(a => `<li>${a.task}${a.assignee ? ` — ${a.assignee}` : ''}</li>`).join('') || '<li>No action items</li>';
      document.getElementById('keywords').innerHTML = (analytics?.keywords || [])
        .map(k => `<span class="badge badge-host">${k}</span>`).join('');
      document.getElementById('transcript').textContent = analytics?.transcript || 'No transcript available';

      window.participantsData = participants;
      document.getElementById('participantCards').innerHTML = participants.map((p, i) => `
        <div class="meeting-item glass" style="cursor:pointer;margin-bottom:0.75rem" data-index="${i}">
          <div>
            <strong>${p.user?.name || 'Unknown'}</strong>
            <div class="meta">Speaking: ${formatSeconds(p.speakingTimeSeconds || 0)} · Engagement: ${p.engagementScore || 0}%</div>
          </div>
          <span class="badge badge-${p.role === 'host' ? 'host' : 'ended'}">${p.role}</span>
        </div>
      `).join('');

      document.querySelectorAll('[data-index]').forEach(el => {
        el.addEventListener('click', () => {
          showParticipantDetail(window.participantsData[parseInt(el.dataset.index, 10)]);
        });
      });
    }

    document.getElementById('downloadBtn').addEventListener('click', async () => {
      try {
        const res = await fetch(`/api/meetings/${meetingId}/report/download`, {
          headers: { Authorization: `Bearer ${api.getToken()}` }
        });
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `meetmind-report-${meetingId}.pdf`;
        a.click();
        URL.revokeObjectURL(url);
      } catch (err) {
        alert('Failed to download report');
      }
    });

    load().catch(err => alert(err.message));
  </script>
</body>
</html>
